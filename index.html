<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منه - ست البنات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
<style>
body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;background:linear-gradient(135deg,#ff758c 0%,#ff7eb3 50%,#ffbe76 100%);font-family:'Cairo';padding:20px}
.card{background:#fff;padding:40px 28px;border-radius:40px;box-shadow:0 20px 60px rgba(0,0,0,0.3);max-width:420px;text-align:center;border:3px solid #ffe4ec}
h1{color:#e91e63;font-size:32px;line-height:1.4;margin:0 0 15px;font-weight:900}
p{color:#222;font-size:23px;line-height:1.9;font-weight:700}
.heart{font-size:60px;animation:beat 1s infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
</style>
</head>
<body>
<div class="card">
<div class="heart">💖</div>
<h1>منه</h1>
<p>
بنوتي وحبيبتي وكل ماليا<br>
ربنا يخليكي ليا يا روح قلبي<br>
وربنا يديمك ليا سند وضهر وكل ماليا<br>
وان شاء الله تكوني في بيتي السنة الجاية<br>
بحبك وبموووووووت فيكي يا ست البنات
</p>
<div class="heart">🎂👑💋</div>
</div>
</body>
</html>
