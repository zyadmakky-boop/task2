<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لـ نونتي ❤️</title>
<style>
body { background: #0a0a0a; color: white; font-family: 'Cairo', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
.card { background: linear-gradient(135deg, #1a1a1a, #2a2a2a); border: 1px solid #ff2e78; border-radius: 20px; padding: 30px; text-align: center; max-width: 400px; width: 90%; box-shadow: 0 0 30px rgba(255,46,120,0.3); }
h1 { color: #ff2e78; font-size: 28px; margin-bottom: 10px; }
#timer { display: flex; justify-content: center; gap: 10px; margin: 20px 0; }
#timer div { background: #ff2e78; padding: 10px 12px; border-radius: 10px; min-width: 55px; }
#timer div span { display: block; font-size: 22px; font-weight: bold; }
#message { display: none; animation: fadeIn 2s; }
#message p { font-size: 19px; line-height: 1.8; }
.heart { font-size: 60px; animation: beat 1s infinite; }
@keyframes beat { 0%,100%{transform:scale(1)} 50%{transform:scale(1.2)} }
@keyframes fadeIn { from{opacity:0; transform: translateY(20px);} to{opacity:1; transform: translateY(0);} }
.small { color: #aaa; font-size: 14px; margin-top: 15px; }
</style>
</head>
<body>
<div class="card">
  <div class="heart">❤️</div>
  <h1>هدية عيد ميلاد نونتي 🎂</h1>
  <p>العد التنازلي ليومك المميز</p>
  
  <div id="timer">
    <div><span id="days">0</span>يوم</div>
    <div><span id="hours">0</span>ساعة</div>
    <div><span id="minutes">0</span>دقيقة</div>
    <div><span id="seconds">0</span>ثانية</div>
  </div>

  <div id="message">
    <h1>كل سنة وانتي طيبة يا نونتي! 🎉🌍</h1>
    <p>اليوم يومك، يوم ميلاد اجمل بنوتة في الدنيا<br>يارب تبقى سنة حلوة عليكي قد حلاوتك<br>بحبك ❤️</p>
  </div>
  <div class="small">من زياد - 21/11/2026</div>
</div>

<script>
// المعاد: 21 نوفمبر 2026 الساعة 00:00:00
const birthdayDate = new Date("2026-11-21T00:00:00").getTime();

const x = setInterval(function() {
  const now = new Date().getTime();
  const distance = birthdayDate - now;

  if (distance <= 0) {
    clearInterval(x);
    document.getElementById("timer").style.display = "none";
    document.getElementById("message").style.display = "block";
  } else {
    document.getElementById("days").innerText = Math.floor(distance / (1000 * 60 * 60 * 24));
    document.getElementById("hours").innerText = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    document.getElementById("minutes").innerText = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
    document.getElementById("seconds").innerText = Math.floor((distance % (1000 * 60)) / 1000);
  }
}, 1000);
</script>
</body>
</html>
